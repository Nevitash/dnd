<mat-accordion>

  <mat-expansion-panel hideToggle [ngClass]="{'critical':isDown()}">
    <mat-expansion-panel-header class="custom-header" [ngClass]="{'critical':isDown()}">
      <mat-icon class="remove-entry-button" (click)="removeEntry($event);">highlight_remove</mat-icon>
      <div class="panel-header-content">
        <mat-panel-title class="panel-title">
          <div class="panel-title-container">
            <span class="tracked-entry-name">{{ this.tracked.name }}</span>
            <div class="hp-slider-container">
              <mat-label>HP:</mat-label>
              @if (this.damageCalc) {
                <ng-container [ngTemplateOutlet]="damageCalcControls"></ng-container>
              } @else {
                <ng-container [ngTemplateOutlet]="hpControls"></ng-container>
              }
              <mat-slider
                [max]="this.tracked.stats.maxHp"
                [showTickMarks]="true" step="1"
                (click)="$event.stopPropagation()"
                class="hp-slider">
                <input matSliderThumb [(ngModel)]="this.tracked.stats.currentHp">
              </mat-slider>
            </div>
          </div>
        </mat-panel-title>
        <mat-panel-description class="panel-description">
          <mat-label>Initiative:</mat-label>
          <span>{{ this.tracked.stats.initiative }}</span>
        </mat-panel-description>
      </div>
    </mat-expansion-panel-header>
    @if (this.imageUrl != undefined) {
      <div class="image-container">
        <drag-scroll>
          <img
            drag-scroll-item
            [ngClass]="{'zoomed': this._zoomedIn}"
            class="entry-image"
            mat-card-image
            [src]="this.imageUrl"
            (click)="toggleZoom()"
            alt="uploaded_image"
          />
        </drag-scroll>
      </div>
    }
  </mat-expansion-panel>
</mat-accordion>

<ng-template #damageCalcControls>
  <mat-form-field appearance="outline" class="hp-input-field">
    <input #hpInput class="hp-input" type="text" matInput [ngModel]="this.tracked.stats.currentHp"
           (keydown.enter)="onHpChange(hpInput.value)">
  </mat-form-field>
  <button mat-fab (click)="doDamage(hpInput.value)" class="damage-button">
    <mat-icon>remove_circle</mat-icon>
  </button>
  <button mat-fab (click)="doHeal(hpInput.value)" class="heal-button">
    <mat-icon>health_and_safety</mat-icon>
  </button>
</ng-template>
<ng-template #hpControls>
  <mat-form-field appearance="outline" class="hp-input-field">
    <input #hpInput class="hp-input" type="number" matInput [ngModel]="this.tracked.stats.currentHp"
           (keydown.enter)="setHp(hpInput.valueAsNumber)" (focusout)="setHp(hpInput.valueAsNumber)">
  </mat-form-field>
</ng-template>
