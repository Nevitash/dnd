<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header class="custom-header">
      <div class="panel-header-content">
        <mat-panel-title class="panel-title">
          <mat-label>Initiative:</mat-label>
          <span>{{ this.tracked.stats.initiative }}</span>
          <span class="tracked-entry-name">{{ this.tracked.name }}</span>
        </mat-panel-title>
        <mat-panel-description class="panel-description">
          <mat-label>Initiative:</mat-label>
          <span>{{ this.tracked.stats.initiative }}</span>
        </mat-panel-description>
      </div>
    </mat-expansion-panel-header>
    @if (this.imageUrl != undefined) {
      <div class="image-container" #imgContainer>
        <drag-scroll>
          <img
            #img
            drag-scroll-item
            [ngClass]="{'zoomed': this._zoomedIn}"
            class="entry-image"
            mat-card-image
            [src]="this.imageUrl"
            (click)="toggleZoom()"/>
        </drag-scroll>
      </div>
    }
  </mat-expansion-panel>
</mat-accordion>
