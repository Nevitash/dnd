<div>
  <h2 class="dialog-title" mat-dialog-title>Add character to tracker</h2>
  <mat-dialog-content>
    <div class="dialog">
      <form (ngSubmit)="this.onSubmit()" [formGroup]="this.form" class="dialog-form">
        <div class="top-container">
          <div class="stats-container">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Character name</mat-label>
              <input [formControlName]="formService.KEY_NAME" matInput placeholder="Nevitash en Ciel"
                     class="name-input">
            </mat-form-field>
            @for (attribute of this.attributeArray.controls; track $index) {
              @if (attribute.value) {
                @if (this.isRollable(attribute)) {
                  <app-attribute-with-modifier
                    [attributeName]="attribute.value!.name"
                    [value]="attribute.value!.value"
                    [modifier]="attribute.value.modifier"
                    [formControl]="attribute"
                    rollCode="1d20"
                    class="side-by-side"
                  />
                } @else {
                  <app-attribute-with-modifier
                    [attributeName]="attribute.value!.name"
                    [value]="attribute.value!.value"
                    [modifier]="attribute.value.modifier"
                    [formControl]="attribute"
                    class="side-by-side"
                  />
                }
              }
            }
          </div>
          <div class="image-container">
            <app-image-upload [formControlName]="formService.KEY_IMAGE"></app-image-upload>
          </div>
        </div>
        <div class="button-container">
          <button [disabled]="!this.form.valid" color="primary" mat-raised-button type="submit">
            <mat-icon>add_circle</mat-icon>
          </button>
          <mat-form-field appearance="outline" class="multiple-input">
            <mat-label>Multi</mat-label>
            <input matInput type="number" [formControlName]="formService.KEY_MULTIPLIER"/>
          </mat-form-field>
        </div>
      </form>
    </div>
  </mat-dialog-content>
</div>
