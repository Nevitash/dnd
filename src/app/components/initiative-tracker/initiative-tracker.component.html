<div class="initiative-tracker-container">
  <div class="initiative-order">
    <mat-list>
      @if (this.phase === Phase.IN_ROUND) {
        @for (entry of this._roundEntries; let index = $index; track entry.id) {
          <app-initiative-tracker-entry
            [ngClass]="{'highlight-entry': index === 0}"
            [tracked]="entry"
            [damageCalc]="this.initiativeService.damageCalc"
            (click)="editEntry(entry)"
            (removeEntryEvent)="removeEntry($event)"
          ></app-initiative-tracker-entry>
        }
        <div class="label-divider-container">
          <mat-label class="centered-label">Next Round</mat-label>
          <mat-divider class="round-divider"></mat-divider>
        </div>
      }
      <div [ngClass]="{'next-round-preview-container': this.phase !== Phase.PREVIEW}">
        @for (entry of this._entries; let index = $index; track entry.id) {
          <app-initiative-tracker-entry
            [ngClass]="{'greyed-out': this.phase === Phase.IN_ROUND}"
            [tracked]="entry"
            [damageCalc]="this.initiativeService.damageCalc"
            (click)="editEntry(entry)"
            (removeEntryEvent)="removeEntry($event)"></app-initiative-tracker-entry>

        }
      </div>

    </mat-list>
  </div>
  <div class="initiative-controls">
    <button mat-fab (click)="addCharacterClick()">
      <mat-icon>add_circle</mat-icon>
    </button>
    <button mat-fab (click)="startNewRound()">
      <mat-icon>start</mat-icon>
    </button>
    <button mat-fab (click)="nextTurn()">
      <mat-icon>next_plan</mat-icon>
    </button>
    <mat-label matTooltip="Damage calulcation adds damage or heals and disables setting the hp manually">DMG CALC
    </mat-label>
    <mat-slide-toggle [(ngModel)]="this.initiativeService.damageCalc"></mat-slide-toggle>
  </div>
</div>
